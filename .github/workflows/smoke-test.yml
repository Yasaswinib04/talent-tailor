name: Smoke test deployed API

# Checks a DEPLOYED instance, on demand. Render's own health check only proves
# the process booted — this proves the data is actually there, the paywall still
# redacts, and one workspace still can't read another's.
#
# Run it from the Actions tab (Run workflow) after a deploy you want to verify.
#
# Setup, the first time you run it (repo Settings → Secrets and variables → Actions):
#   Variables → API_URL         https://talent-tailor-api.onrender.com   (no trailing slash)
#   Variables → TT_TEST_EMAIL   qa@yourdomain.com   ("tt" is just Talent Tailor —
#                               a throwaway address, not an account anywhere. Every
#                               recruiter route needs a login now, so the suite needs
#                               one to sign in with. Created on first run, reused after.)
#   Secrets   → TT_TEST_PASSWORD  any password, 8+ characters
#
# Missing configuration still FAILS rather than skipping: you asked for this run,
# so it owes you an answer instead of a green tick that tested nothing. That was
# always the point of failing loudly — but it used to apply on every push to main,
# which meant an unconfigured repo showed a permanent red X that said nothing about
# the code. tests.yml now covers every push with a signal that needs no setup, so
# this one only runs when you ask for it.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the workflow is configured
        env:
          API_URL: ${{ vars.API_URL }}
          TT_TEST_EMAIL: ${{ vars.TT_TEST_EMAIL }}
          TT_TEST_PASSWORD: ${{ secrets.TT_TEST_PASSWORD }}
        run: |
          missing=""
          [ -z "$API_URL" ] && missing="$missing API_URL(variable)"
          [ -z "$TT_TEST_EMAIL" ] && missing="$missing TT_TEST_EMAIL(variable)"
          [ -z "$TT_TEST_PASSWORD" ] && missing="$missing TT_TEST_PASSWORD(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured — missing:$missing. See the comment at the top of this file."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Wait for the deploy to go live
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # Up to 10 min: Render builds for ~2-4 min, and a free instance that
          # was asleep adds ~50s of cold start on top. --max-time 70 keeps a
          # single slow wake-up from being counted as a failure.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 "$API_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "API is live after ${i} attempt(s)."
              exit 0
            fi
            echo "attempt $i: got HTTP $code — retrying in 15s"
            sleep 15
          done
          echo "::error::$API_URL/api/health never returned 200. Check the Render logs."
          exit 1

      - name: Run the suite against production
        env:
          REACT_APP_BACKEND_URL: ${{ vars.API_URL }}
          TT_TEST_EMAIL: ${{ vars.TT_TEST_EMAIL }}
          TT_TEST_PASSWORD: ${{ secrets.TT_TEST_PASSWORD }}
        run: |
          # No -k exclusions any more. Every test signs in and writes only
          # inside the QA account's own workspace, so a production run can no
          # longer drip fake applicants into real data the way it used to.
          pytest backend/tests/backend_test.py -q
