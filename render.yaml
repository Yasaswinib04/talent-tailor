# Render Blueprint — Talent Tailor
#
# Two services, both on Render's free tier:
#   talent-tailor-api  — FastAPI backend (free web service, sleeps after 15 min idle)
#   talent-tailor-web  — React build served as a static site (free, never sleeps, CDN)
#
# The database is NOT here: MongoDB Atlas M0 is free forever and lives outside Render.
# Set MONGO_URL manually in the Render dashboard (sync: false = "ask me, don't commit it").
#
# Deploy order matters: the API must exist before the web build, because CRA bakes
# REACT_APP_BACKEND_URL into the bundle at build time. See DEPLOY.md.

services:
  - type: web
    name: talent-tailor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Matches the local venv this app was built and tested against.
      - key: PYTHON_VERSION
        value: "3.13.2"
      # Atlas SRV string, e.g. mongodb+srv://user:pass@cluster.mongodb.net
      # Never commit this — paste it in the Render dashboard.
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: talent_tailor
      # OpenRouter key for LLM resume/JD extraction. Without it the app still
      # runs, falling back to the keyword heuristic (visibly worse shortlists).
      - key: OPENROUTER_API_KEY
        sync: false
      # Swap tiers here without a deploy; see .env.example for the trade-off.
      # Resume parsing = candidate-facing, fast tier. JD extraction = recruiter-
      # facing, bigger model. OPENROUTER_MODEL (unset here) overrides both.
      - key: OPENROUTER_MODEL_RESUME
        value: google/gemini-3.5-flash
      - key: OPENROUTER_MODEL_JD
        value: google/gemini-2.5-pro
      # Signs auth tokens. Rotating it signs everyone out.
      - key: SECRET_KEY
        sync: false
      # The manual-payment bridge: share this code with a buyer once they pay,
      # they enter it on the job page, the shortlist unlocks.
      - key: UNLOCK_CODE
        sync: false
      # Lock CORS to the web service's origin once both URLs are known,
      # e.g. https://talent-tailor-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: talent-tailor-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      # Render sets CI=true, which makes react-scripts treat ESLint warnings as
      # build failures. Without this the build dies on a stray unused import.
      - key: CI
        value: "false"
      # Set to the API service's URL, e.g. https://talent-tailor-api.onrender.com
      # No trailing slash — src/lib/api.js appends "/api".
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      # SPA fallback. Without this, hard-refreshing /app/jobs/new returns a 404
      # because no such file exists on disk — React Router handles it client-side.
      - type: rewrite
        source: /*
        destination: /index.html
